# Mr Folio, Folio's Discord bot. Application 1553079678988849294.
#
#   npx wrangler deploy
#   npx wrangler secret put DISCORD_PUBLIC_KEY     # from the application's General Information page
#
# Then paste the Worker's URL into Interactions Endpoint URL on that same page. Discord sends two deliberately
# invalid requests when you save it; an endpoint that answers those is rejected, which is what verify() is for.
name = "folio-bot"
main = "worker.js"
compatibility_date = "2026-09-01"

# Two accounts answer to this login, so naming one keeps `wrangler deploy` from stopping to ask.
account_id = "2ac16bbf295c2dacf6e2d7c135c8ebdb"

# The bot answers on its workers.dev address. It needs no custom domain: only Discord ever calls it.
workers_dev = true

[vars]
GUILD_ID = "1551382087985266838"
# The ping role the "Get release pings" button hands out and takes back.
ROLE_UPDATES = "1553093586705449062"

# The first reply in #help and the forums (autoreply.mjs). Switch it off with AUTO_REPLY = "off" and a deploy.
AUTO_REPLY = "on"
BOT_ID = "1553079678988849294"
# McCal's own account: his posts never get an automatic reply.
STAFF_IDS = "224692018515935233"
HELP_CHANNEL = "1553093592438800445"
FAQ_CHANNEL = "1555694592639246477"
BUG_FORUM = "1555691880564527206"
IDEAS_FORUM = "1555693466288394421"

# Every two minutes. Each pass reads the latest messages and replies once to anything new.
[triggers]
crons = ["*/2 * * * *"]
