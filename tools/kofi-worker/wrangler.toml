name = "folio-supporter-codes"
main = "worker.js"
account_id = "2ac16bbf295c2dacf6e2d7c135c8ebdb"   # the McCal account
compatibility_date = "2026-09-01"

# Made with: wrangler d1 create folio-codes (22 Sep 2026, on the McCal account)
[[d1_databases]]
binding = "DB"
database_name = "folio-codes"
database_id = "a878ea66-ca8b-426a-8ed9-ecdcf0c5e9ed"

[vars]
# Which payment earns which pool of codes. Anything not named here earns nothing.
# McCal, 23 Sep 2026: every payment earns the code. "*" covers every tier, including ones added later, so a new tier
# is never silently worth nothing.
#
# Members get a TWO-month code at every payment (m2), on purpose: a code starts counting when it is redeemed, so
# someone who pays on the 1st and redeems on the 3rd would otherwise be locked out for two days before the next
# payment lands. Two months overlap, and a late or retried payment never shows as a lapse.
#
# One-offs get one month (m1): $3 buys a month wherever it is paid, and tips under $3 are a thank-you rather than a
# purchase. The shop item goes here too once it exists.
#
# The badge is built now (#89), so $15 or more earns it again (McCal, 23 Sep). Nothing here lasts for ever: a
# `thanks` code runs out like any other, and all it does on the way in is have Folio write down the month, which is
# what the badge shows. So there is no serial to withdraw later, which was the worry when it was dropped.
# Builder is $15 a month, so it draws from `m2thanks`: two months, like every other tier, on a code that carries
# the badge. A one-off of $15 or more draws from `thanks`: one month, as one-offs are, with the badge.
# A shop item is the simplest thing to sell: someone buys it, Ko-fi calls the worker, the worker emails a code.
# Add it under "shop" with the item's direct_link_code (the last part of its Ko-fi link) - see the README.
POOLS = '{"tiers":{"*":"m2","Builder":"m2thanks"},"shop":{},"tipBands":[{"from":15,"pool":"thanks"}],"tipFrom":3,"tipPool":"m1","tipCurrency":"USD","tipRates":{"EUR":1.08,"GBP":1.27,"CAD":0.73,"AUD":0.66,"CHF":1.1}}'
# McCal, 23 Sep 2026. Replies reach him through Cloudflare Email Routing; Resend verifies send.foliolauncher.com,
# which nobody sees, so a spam mark never touches the domain the site is on.
MAIL_FROM = "Folio <admin@foliolauncher.com>"

# Secrets, set with `wrangler secret put NAME` (never in this file):
#   KOFI_TOKEN   the verification token from Ko-fi's Webhooks page
#   RESEND_KEY   optional; without it codes are still claimed and recorded, just not emailed
#   ADMIN_TOKEN  a long random string shared with scripts/code-admin.py (and Folio Dev); /admin/ is off without it

# Supporters' beta builds. The worker reads a private repository with its own token and hands Folio a short-lived
# download link; see the README. Leave BETA_REPO empty to turn the beta broker off.
BETA_REPO = "McCal-Codes/folio-beta"
SUPPORTER_KEYS = "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEM4vVq0D/ZzqkVWlyQYMTFN3TTbdqRgKdt2a30T88NkeQhDEWnujFjfyXyKtPIVBKMSiRVXeY/OcC0+TaB6eypg=="   # BetaKeys.SUPPORTER

# Secrets go in with `wrangler secret put`, never in this file:
#   GITHUB_TOKEN   a fine-grained token with Contents: read on the beta repository, and nothing else
#   TICKET_SECRET  any long random string; it signs each download link to the code that asked for it
#   WITHDRAWN      optional, serials of codes that no longer work, separated by commas
