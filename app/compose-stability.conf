// Types Compose can't prove stable but that Folio never changes once it has made them. Declaring them here lets
// Compose skip redrawing an icon, a widget card or an island event when the new value equals the old one, instead of
// redrawing on every new copy. Only list a type if nothing in Folio mutates it after creating it.

// Icons and pictures: decoded once, then replaced, never drawn into.
android.graphics.Bitmap
// Identity types: immutable in Android.
android.content.ComponentName
android.os.UserHandle
// Widget providers as Android hands them to the launcher; Folio only reads them.
android.appwidget.AppWidgetProviderInfo
// Times: java.time values are immutable.
java.time.*
// Folio's state holds read-only List/Set/Map and replaces them rather than mutating them.
kotlin.collections.*
