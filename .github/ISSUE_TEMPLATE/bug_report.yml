name: Bug report
description: Something in Folio isn't working right
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Help › **Report a Bug** in Folio fills in the phone details for you, and can copy diagnostics to paste below.
        Before attaching screenshots or crash reports, check them for notifications, account names, contacts or work data.
  - type: input
    id: version
    attributes:
      label: Folio version
      description: Settings › Help › What's New
      placeholder: "0.4.0"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone
      placeholder: "Samsung Galaxy Z Fold8"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: "16 (API 36)"
    validations:
      required: true
  - type: dropdown
    id: screen
    attributes:
      label: Screen
      options:
        - Folded (cover screen)
        - Unfolded
        - Half folded
        - Phone, tablet or other (not a foldable)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Long press an empty spot on Home
        2. Tap Add Widget
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Screenshots, a screen recording or a crash report (Settings › Help › Safe Mode & crash reports) help a lot.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Folio fills in a short summary here (phone, screen, where Home was, recent events and the top of the latest crash). Keep it.
        For the full file with Folio's own log, use Settings › Help › Report a Bug › **Email a Report** (no account needed), or **Copy Diagnostics** and paste it below the summary. Check it before posting.
      render: text
    validations:
      required: false
