# Tells Discord about a release, once, when it is published.
#
# Two separate announcements, each with its own secret and role variable, so one server's settings never touch the other's:
#
#   Folio's own server   FOLIO_DISCORD_WEBHOOK_URLS, FOLIO_DISCORD_ROLE_IDS. Hears about every release, betas included,
#                        and first, so nobody elsewhere hears before the people who use it.
#   Mod My Android       MMD_DISCORD_WEBHOOK_URLS, MMD_DISCORD_ROLE_IDS. Stable releases only: the private
#                        #community-developers test channel first, then the public #app-updates.
#
# Each secret is one webhook or several separated by commas, and each role variable lists one role per webhook in the
# same order, since a role only exists in its own server. Leave a position empty for no ping there: ",<role id>" pings
# nobody in the test channel and the role in #app-updates. Nothing is sent for a server until its secret exists.
name: Announce

on:
  release:
    types: [published]
  # For re-posting one by hand, and for the first test against a release that is already out.
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to post, for example v0.6.6
        required: true

permissions:
  contents: read

concurrency:
  group: announce-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both triggers end up with the same file, so the manual run and the automatic one cannot drift apart. A step cannot
      # change GITHUB_EVENT_PATH, which is why a manual run used to fail with "The event carries no release"; the script
      # reads this file by its own name instead.
      - name: Gather the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > release.json
          echo "RELEASE_FILE=$PWD/release.json" >> "$GITHUB_ENV"

      # Folio's own server first, betas included. A failure here must not stop the Mod My Android post, so that step
      # runs whatever happened before it and the job still ends red if either failed.
      - name: Post to Folio's server
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.FOLIO_DISCORD_WEBHOOK_URLS }}
          DISCORD_ROLE_ID: ${{ vars.FOLIO_DISCORD_ROLE_IDS }}
          ANNOUNCE_PRERELEASES: "true"
        run: node tools/announce-release.mjs

      # No ANNOUNCE_PRERELEASES: the script skips a pre-release, which is how betas stay out of Mod My Android.
      - name: Post to Mod My Android
        if: ${{ !cancelled() }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.MMD_DISCORD_WEBHOOK_URLS }}
          DISCORD_ROLE_ID: ${{ vars.MMD_DISCORD_ROLE_IDS }}
        run: node tools/announce-release.mjs
