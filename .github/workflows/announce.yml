# Tells Discord about a release, once, when it is published.
#
# Posts to every webhook in the secret DISCORD_WEBHOOK_URLS, comma-separated: Folio's own #announcements and Mod My
# Android's #app-updates. Nothing is sent until that secret exists, so this is inert until it does.
#
# The variable DISCORD_ROLE_IDS holds the role to ping in each of those servers, in the same order, since a role only
# exists in its own server. Leave a position empty for no ping there.
#
# The old names, MMD_WEBHOOK_URL and MMD_ROLE_ID, still work, so nothing breaks if they were set first.
name: Announce

on:
  release:
    types: [published]
  # For re-posting one by hand, and for the first test against a release that is already out.
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to post, for example v0.6.6
        required: true

permissions:
  contents: read

concurrency:
  group: announce-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both triggers end up with the same file, so the manual run and the automatic one cannot drift apart.
      - name: Gather the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > release.json
          jq '{release: .}' release.json > event.json
          echo "GITHUB_EVENT_PATH=$PWD/event.json" >> "$GITHUB_ENV"

      - name: Post it
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URLS || secrets.MMD_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ vars.DISCORD_ROLE_IDS || vars.MMD_ROLE_ID }}
          ANNOUNCE_PRERELEASES: ${{ vars.ANNOUNCE_PRERELEASES }}
        run: node tools/announce-release.mjs
